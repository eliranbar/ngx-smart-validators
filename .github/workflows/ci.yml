name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack:dry-run

  angular-compatibility:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: 17
            node: 20
          - angular: 22
            node: 24.15.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - name: Pack library
        run: npm pack ./dist/ngx-smart-validators --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compile consumer on Angular ${{ matrix.angular }}
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes @angular/cli@${{ matrix.angular }} new consumer \
            --defaults --skip-git --skip-install --style=css
          cd consumer
          npm install
          npm install ../ngx-smart-validators-0.0.1.tgz libphonenumber-js
          printf "\nimport { strictEmail } from 'ngx-smart-validators';\nimport { phoneNumber } from 'ngx-smart-validators/phone';\nvoid strictEmail;\nvoid phoneNumber;\n" >> src/main.ts
          npm run build
